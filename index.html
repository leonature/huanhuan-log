<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="转动欢欢的菜单，让小幸运决定今天吃什么。" />
    <title>神的菜单｜欢欢今天吃什么</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>
      <div class="floating-decor decor-one">✿</div>
      <div class="floating-decor decor-two">♡</div>
      <div class="floating-decor decor-three">✦</div>

      <section class="menu-card" aria-labelledby="page-title">
        <header>
          <p class="eyebrow"><span></span>HUANHUAN'S LITTLE ORACLE<span></span></p>
          <h1 id="page-title">神的菜单</h1>
          <p class="subtitle">今天吃什么，让小幸运来决定</p>
        </header>

        <nav class="meal-tabs" aria-label="选择餐别">
          <button class="meal-tab active" type="button" data-meal="breakfast" aria-pressed="true">
            <span>☀</span> 早餐
          </button>
          <button class="meal-tab" type="button" data-meal="main" aria-pressed="false">
            <span>♡</span> 正餐
          </button>
        </nav>

        <div class="wheel-stage">
          <div class="pointer" aria-hidden="true"><i></i></div>
          <div class="wheel-shadow"></div>
          <div class="wheel" id="wheel" aria-label="早餐选择转盘">
            <div class="wheel-ring"></div>
            <div class="divider"></div>
            <div class="wheel-label label-one">
              <span class="dish-icon" id="icon-one">♨</span>
              <strong id="name-one">灌汤小笼包</strong>
              <small id="desc-one">一笼热气 · 汤鲜皮薄</small>
            </div>
            <div class="wheel-label label-two">
              <span class="dish-icon" id="icon-two">◒</span>
              <strong id="name-two">豆腐脑</strong>
              <small id="desc-two">细嫩顺滑 · 暖胃刚好</small>
            </div>
          </div>

          <button class="spin-button" id="spin-button" type="button">
            <span id="button-text">开转</span>
            <small id="button-subtext">SPIN</small>
          </button>
        </div>

        <div class="answer" id="answer" aria-live="polite">
          <span>神谕已降下</span>
          <strong id="result">等待天意</strong>
        </div>

        <footer><span>♡</span><p>欢欢的每一天，都要从好心情开始</p><span>♡</span></footer>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
